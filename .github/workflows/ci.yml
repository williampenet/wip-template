name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  conventions:
    name: PR conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title references a Linear ticket
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if ! echo "$TITLE" | grep -Eq '^WIP-[0-9]+: '; then
            echo "::error::PR title must start with 'WIP-<number>: ' to link the Linear ticket."
            exit 1
          fi

  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node projects (auto-detected)
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: hashFiles('package.json') != ''
        run: npm ci
      - if: hashFiles('package.json') != ''
        run: npm run lint --if-present
      - if: hashFiles('package.json') != ''
        run: npm test --if-present
      - if: hashFiles('package.json') != ''
        run: npm run build --if-present

      # Python projects (auto-detected)
      - if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: hashFiles('pyproject.toml') != ''
        run: |
          pip install -e ".[dev]" || pip install -e .
          pip install pytest ruff
          ruff check .
          pytest -q || [ $? -eq 5 ]

      - name: Template sanity check
        if: hashFiles('package.json') == '' && hashFiles('pyproject.toml') == ''
        run: test -f CLAUDE.md && test -f docs/PRD.md && test -f docs/BUILD_LOG.md
